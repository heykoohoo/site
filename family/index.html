<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>koohoo · friends &amp; family</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#FDF6ED">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#3A1236;--cream:#FDF6ED;--blush:#F4A9BC;--rose:#E2506A;--berry:#7A2D5A;--grad:linear-gradient(135deg,#E2506A,#7A2D5A)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--cream)}
body{font-family:Nunito,system-ui,sans-serif;color:var(--plum);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(env(safe-area-inset-bottom) + 24px);overflow-x:hidden;position:relative}
.blob{position:fixed;border-radius:50%;background:var(--blush);opacity:.32;z-index:0;pointer-events:none}
main{width:100%;max-width:360px;text-align:center;position:relative;z-index:1}
.mk{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 18px;box-shadow:0 10px 26px rgba(122,45,90,.25)}
h1{font:600 30px/1.1 Fredoka,sans-serif;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--rose)}
p.s{margin:10px auto 26px;font-size:16px;line-height:1.4;opacity:.8;max-width:300px}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;height:56px;border-radius:18px;border:2px solid var(--blush);background:#fff;padding:0 18px;font:700 19px Nunito,sans-serif;color:var(--plum);text-align:center;outline:none;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(226,80,106,.15)}
input::placeholder{color:#c9aab3;font-weight:400}
button{height:56px;border:0;border-radius:18px;background:var(--grad);color:#fff;font:600 19px Fredoka,sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(122,45,90,.28)}
button:disabled{opacity:.6}
.msg{min-height:44px;margin-top:14px;font-size:15px;line-height:1.35}
.msg.err{color:var(--rose);font-weight:700}
.note{margin-top:10px;background:#fff;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.4;text-align:left;box-shadow:0 2px 10px rgba(58,18,54,.07);display:none}
.note b{color:var(--rose)}
.foot{margin-top:30px;font-size:12px;opacity:.45}
</style>
</head>
<body>
<div class="blob" style="width:300px;height:300px;left:-120px;top:-90px"></div>
<div class="blob" style="width:260px;height:260px;right:-110px;bottom:-60px"></div>
<main>
 <img class="mk" src="../icon-192.png" alt="">
 <h1>Hi! <em>What's your name?</em></h1>
 <p class="s">Type your first name and we'll take you to your new friend.</p>
 <div class="note" id="inapp"></div>
 <form id="f" autocomplete="off">
  <input id="n" name="n" placeholder="Your first name" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
  <button id="go" type="submit">Let's go</button>
 </form>
 <div class="msg" id="m"></div>
 <div class="foot">koohoo.app · friends &amp; family</div>
</main>
<script>
(()=>{
 const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua);
 // LINE opens links in its own browser: ask it for the real one (same trick as the bots)
 if(/\bLine\//i.test(ua)&&!/openExternalBrowser=1/.test(location.search)){location.replace(location.pathname+'?openExternalBrowser=1');return}
 const inapp=/FBAN|FBAV|Instagram|TikTok|musical_ly|BytedanceWebview|Snapchat/i.test(ua),note=document.getElementById('inapp');
 if(inapp){note.innerHTML='First, open this page in '+(ios?'<b>Safari</b>':'<b>Chrome</b>')+': tap <b>⋯</b> at the top right, then <b>Open in external browser</b>.';note.style.display='block'}
 else if(ios&&/CriOS|FxiOS|EdgiOS/.test(ua)){note.innerHTML='On iPhone, please open this page in <b>Safari</b> so you can add the app to your Home Screen.';note.style.display='block'}
 const f=document.getElementById('f'),n=document.getElementById('n'),m=document.getElementById('m'),go=document.getElementById('go');
 const norm=s=>s.trim().toLowerCase().split(/\s+/).join(' ');
 const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
 const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 f.onsubmit=async e=>{e.preventDefault();const name=norm(n.value);if(!name)return;
  go.disabled=true;m.className='msg';m.textContent='One sec…';
  try{
   const enc=new TextEncoder(),id=hex(await crypto.subtle.digest('SHA-256',enc.encode('koohoo-family|'+name)));
   const map=await (await fetch('family.json?t='+Date.now(),{cache:'no-store'})).json(),hit=map[id];
   if(!hit){m.className='msg err';m.textContent="Hmm, I don't know that name yet. Check the spelling, or ask whoever sent you this link.";go.disabled=false;return}
   const base=await crypto.subtle.importKey('raw',enc.encode(name),'PBKDF2',false,['deriveKey']);
   const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('koohoo-family-v1'),iterations:100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
   const link=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(hit.iv)},key,b64(hit.ct)));
   m.textContent='Found you! Taking you there…';location.href=link;
  }catch(err){m.className='msg err';m.textContent='Something went wrong. Try again in a minute.';go.disabled=false}
 };
})();
</script>
</body>
</html>
